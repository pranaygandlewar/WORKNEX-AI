[project]
name = "worknex-ai"
version = "1.0.0"
description = "WORKNEX AI — AI-Powered Enterprise Workflow & Resource Management Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "mcp<2.0.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.13.4",
    "pyjwt>=2.8.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
